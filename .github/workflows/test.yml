name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: |
          python scripts/version.py check
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check shell scripts
        run: |
          sh -n scripts/install.sh
          sh -n scripts/uninstall.sh
          sh -n scripts/release.sh

  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install and test Formula
        run: |
          brew style Formula/runcat-ai-usage.rb
          brew tap local/runcat-ai-usage "$GITHUB_WORKSPACE"
          brew install --skip-post-install local/runcat-ai-usage/runcat-ai-usage
          brew test local/runcat-ai-usage/runcat-ai-usage
