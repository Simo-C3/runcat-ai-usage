[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runcat-ai-usage"
version = "0.3.1"
description = "AI plan usage cards for RunCat Neo"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Simo-C3" }]
keywords = ["runcat", "claude-code", "codex", "github-copilot", "macos"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]

[project.scripts]
runcat-ai-usage = "runcat_ai_usage:main"

[tool.setuptools]
py-modules = [
    "app",
    "cache",
    "config",
    "history",
    "models",
    "output",
    "runcat_ai_usage",
    "services",
    "storage",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["providers"]
