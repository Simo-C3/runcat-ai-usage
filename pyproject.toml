[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runcat-ai-usage"
version = "0.1.0"
description = "AI plan usage cards for RunCat Neo"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Simo-C3" }]
keywords = ["runcat", "claude-code", "codex", "github-copilot", "macos"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]

[project.scripts]
runcat-ai-usage = "runcat_ai_usage.app:main"

[tool.setuptools.packages.find]
where = ["src"]
