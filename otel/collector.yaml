# Native agents (OTLP protobuf/JSON, HTTP or gRPC) and plan quota collection.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512

exporters:
  otlp_http/runcat:
    endpoint: http://127.0.0.1:4319
    encoding: json
    compression: none
    timeout: 5s
    sending_queue:
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      max_elapsed_time: 0s

extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  file_storage:
    directory: ${env:RUNCAT_AI_USAGE_STATE_DIR}/collector-queue
    create_directory: true

service:
  extensions: [health_check, file_storage]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/runcat]
